name: PR Governance

# Required status check: enforces that only the assigned reviewer (or the
# super-owner abdulrahmanhossam) may merge a pull request.
#
# Rules:
#   1. abdulrahmanhossam → always passes (super-owner bypass).
#   2. PR actor is in the PR's assignees list → passes.
#   3. Anyone else → fails with an explanatory message.

on:
  pull_request:
    types: [opened, synchronize, reopened, assigned, unassigned]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: read
  statuses: write
  checks: write

jobs:
  governance-check:
    name: Merge Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check merge eligibility
        uses: actions/github-script@v7
        with:
          script: |
            const SUPER_OWNER = 'abdulrahmanhossam';

            const pr     = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // The actor who triggered the workflow run.
            const actor  = (context.actor || '').toLowerCase();

            // Super-owner bypass.
            if (actor === SUPER_OWNER.toLowerCase()) {
              core.info(`Super-owner ${actor} – governance check bypassed.`);
              return;
            }

            // Fetch current PR data to get up-to-date assignees.
            const { data: prData } = await github.rest.pulls.get({
              owner, repo, pull_number: pr.number,
            });

            const assignees = (prData.assignees || []).map(
              (u) => u.login.toLowerCase()
            );

            if (assignees.length === 0) {
              // No assignees yet — treat as pending, not a hard fail.
              core.info('No assignees on PR yet; governance check is advisory until assigned.');
              return;
            }

            if (assignees.includes(actor)) {
              core.info(`Actor ${actor} is an assignee – merge allowed.`);
              return;
            }

            // Actor is neither the super-owner nor an assignee → block.
            core.setFailed(
              `Merge blocked: @${actor} is not an assigned reviewer for this PR. ` +
              `Only the assigned reviewer(s) (${assignees.join(', ')}) or ` +
              `@${SUPER_OWNER} may merge. ` +
              `If you believe this is an error, ask @${SUPER_OWNER} to reassign.`
            );
